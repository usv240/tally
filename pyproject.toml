[project]
name = "tally"
version = "0.1.0"
description = "Tally: a hands-free agent for home child care providers. Built with Strands Agents and Amazon Bedrock AgentCore."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "pydantic>=2",
    "pyyaml",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
